<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Color Mixing Quiz</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="quiz-container">
      <h1>Color-Mix Quiz</h1>
      <div id="question"></div>
      <div id="color-display">
        <div id="color1"></div>
        <div id="color2"></div>
      </div>
      <div id="options">
        <button class="option" id="option1"></button>
        <button class="option" id="option2"></button>
      </div>
      <div id="result"></div>
      <div id="controls">
        <button id="leave-button">Leave Quiz</button>
        <button id="restart-button" style="display: none">Do It Again?</button>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
